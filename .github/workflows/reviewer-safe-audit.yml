name: Reviewer-safe aggregate audit

on:
  push:
    branches:
      - review/reviewer-safe-audit-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private review branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install "numpy>=2.1,<3" "pandas>=2.2,<3"
      - name: Check math unit tests
        run: python -m unittest discover -s tests -v
      - name: Reject restricted files and suspect secrets
        run: python reviewer_safe/verify_private_release_safety.py
      - name: Check reviewer-safe aggregate data (no raw tweets)
        run: python reviewer_safe/verify_reviewer_safe_repo.py
